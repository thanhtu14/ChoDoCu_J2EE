spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=chodocu;encrypt=true;trustServerCertificate=true
    username: sa
    password: "ChoDoCuJ2EE@"
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    # Local development only; override with APP_JWT_KEY outside development.
    key: ${APP_JWT_KEY:ChoDoCu-Development-Only-Key-Change-This-32-Bytes-Minimum}
    issuer: ChoDoCu
    audience: ChoDoCu.Client
    expire-minutes: 120
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:}
    admin-password: ${SEED_ADMIN_PASSWORD:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:no-reply@chodocu.local}
    reset-url: ${PASSWORD_RESET_URL:http://localhost:5173/quen-mat-khau}

server:
  port: 8080
